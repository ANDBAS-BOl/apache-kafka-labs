spring.application.name=EmailNotificationService
server.port=0
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.appandres.core.domain.event.ProductCreatedEvent
#Consumer Group configure from here
#spring.kafka.consumer.group-id=product-created-events
spring.kafka.consumer.properties.spring.json.trusted.packages=com.appandres.core.domain.event

#To Manage DeadLetterTopic
spring.kafka.producer.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

#To Manage Retrys and NotRetreys
app.kafka.listener.retry.interval-ms=5000
app.kafka.listener.retry.max-attempts=3
app.downstream.product-ack.url=http://localhost:8082/response/200

#To Group of consumers configure from kafka bean (ConsumerFactory)
consumer.group-id=product-created-events

#Config DB
spring.datasource.username=andres
spring.datasource.password=andres
spring.datasource.url=jdbc:h2:mem:testDB
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
