spring.application.name=TransferService
server.port=0

# ---------- Kafka Producer (transaccional) ----------
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000

spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.producer.transaction-id-prefix=transfer-service-${random.value}-

# ---------- Topics ----------
app.kafka.withdraw-money-topic=withdraw-money-topic
app.kafka.deposit-money-topic=deposit-money-topic

# ---------- Servicio remoto de validación (mock) ----------
app.remote.validation-url=http://localhost:8082/response/200

# ---------- Outbox relay (poller) ----------
# Cada cuánto (ms) el relay revisa la tabla outbox_events y publica lo pendiente.
app.outbox.poll-delay-ms=5000

# ---------- Base de datos H2 (en memoria) ----------
spring.datasource.url=jdbc:h2:mem:testDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=andres
spring.datasource.password=andres
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# ---------- Logging de transacciones ----------
logging.level.org.springframework.kafka.transaction=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.orm.jpa.JpaTransactionManager=INFO
logging.level.org.apache.kafka.clients.producer.internals.TransactionManager=INFO
